<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Van Paris - Votre VTC de Prestige</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo">TAXI VAN PARIS</div>
            <ul class="nav-links">
                <li><a href="#">Accueil</a></li>
                <li><a href="#">Nos Services</a></li>
                <li><a href="#">Tarifs</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <h1>Votre taxi van à Paris</h1>
            
            <div class="booking-card">
                <h3>Réservation</h3>
                <form>
                    <input type="text" placeholder="Point de départ" required>
                    <input type="text" placeholder="Destination" required>
                    
                    <div class="row">
                        <input type="date" required>
                        <input type="time" required>
                    </div>

                    <div class="select-group">
                        <label for="passagers">Passagers</label>
                        <select id="passagers" name="passagers">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-calc">Calculer Tarifs</button>
                </form>
            </div>
        </div>
    </header>
</body>
</html>
