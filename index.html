<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanPremium | Réservation Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --accent: #276ef1;
            --whatsapp: #25D366;
            --gray-bg: #f6f6f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--black); color: var(--white); }

        nav {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .logo { font-weight: 800; font-size: 1.4rem; }
        .nav-phone { color: var(--accent); text-decoration: none; font-weight: 600; }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 5%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=2000') no-repeat center/cover;
            flex-wrap: wrap;
        }

        .hero-text { flex: 1; min-width: 300px; margin-bottom: 40px; }
        .hero-text h1 { font-size: 3rem; margin-bottom: 20px; line-height: 1.1; }

        /* --- Formulaire --- */
        .calc-box {
            background: var(--white);
            color: var(--black);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .calc-box h2 { margin-bottom: 20px; font-weight: 800; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #666; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            background: var(--gray-bg); font-size: 0.9rem; margin-bottom: 10px;
        }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 5px; margin: 15px 0; }
        .opt-item { display: flex; align-items: center; font-size: 0.85rem; }
        .opt-item input { width: auto; margin-right: 10px; margin-bottom: 0; }

        .btn-main {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-calc { background: var(--black); color: var(--white); }
        .btn-whatsapp { background: var(--whatsapp); color: var(--white); display: none; text-decoration: none; text-align: center; }
        .btn-call { background: var(--accent); color: var(--white); text-decoration: none; display: block; text-align: center; margin-top: 10px; }

        #result-display {
            margin-top: 20px; padding: 15px; background: #eef4ff; border-radius: 8px; display: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">VAN<span style="color:var(--accent)">PREMIUM</span></div>
        <a href="tel:0033649553640" class="nav-phone">📞 06 49 55 36 40</a>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>Réservez votre<br>Van de Luxe</h1>
            <p>Chauffeur privé, services sur mesure et confort absolu.</p>
        </div>

        <div class="calc-box">
            <h2>Calculateur de prix</h2>
            
            <label>Adresse de départ</label>
            <input type="text" id="start" placeholder="Ex: Paris, Tour Eiffel">
            
            <label>Adresse d'arrivée</label>
            <input type="text" id="end" placeholder="Ex: Aéroport CDG">

            <div class="input-row">
                <div>
                    <label>Distance (km)</label>
                    <input type="number" id="km" placeholder="Ex: 25" min="1">
                </div>
                <div>
                    <label>Type de service</label>
                    <select id="service">
                        <option value="0">Standard (7 pl.)</option>
                        <option value="20">Business (+20€)</option>
                    </select>
                </div>
            </div>

            <label>Options spécifiques</label>
            <div class="options-grid">
                <div class="opt-item"><input type="checkbox" id="siegeBebe"> Siège Bébé (+5€)</div>
                <div class="opt-item"><input type="checkbox" id="rehausseur"> Réhausseur (+5€)</div>
                <div class="opt-item"><input type="checkbox" id="bagages"> Assistance Bagages (+10€)</div>
            </div>

            <button class="btn-main btn-calc" onclick="calculerDevis()">Estimer le tarif</button>
            
            <div id="result-display">
                <p style="font-size: 0.8rem;">Estimation totale :</p>
                <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent);" id="finalPrice">0 €</div>
                <a id="waLink" href="#" target="_blank" class="btn-main btn-whatsapp">Réserver via WhatsApp</a>
            </div>

            <a href="tel:0033649553640" class="btn-main btn-call">Appeler maintenant</a>
        </div>
    </section>

    <script>
        function calculerDevis() {
            const km = parseFloat(document.getElementById('km').value);
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const serviceExtra = parseFloat(document.getElementById('service').value);
            
            if(!km || !start || !end) {
                alert("Veuillez remplir le départ, l'arrivée et la distance.");
                return;
            }

            // Calculs selon tes consignes
            let total = 15; // Prise en charge
            total += (km * 2.90);
            total += serviceExtra;

            let optionsList = [];
            if(document.getElementById('siegeBebe').checked) { total += 5; optionsList.push("Siège Bébé"); }
            if(document.getElementById('rehausseur').checked) { total += 5; optionsList.push("Réhausseur"); }
            if(document.getElementById('bagages').checked) { total += 10; optionsList.push("Assistance Bagages"); }

            // Affichage
            document.getElementById('result-display').style.display = 'block';
            document.getElementById('finalPrice').innerText = total.toFixed(2) + " €";

            // Préparation du lien WhatsApp
            const message = `Bonjour, je souhaite réserver un Van.%0A%0A` +
                            `📍 Départ: ${start}%0A` +
                            `🏁 Arrivée: ${end}%0A` +
                            `📏 Distance: ${km} km%0A` +
                            `🛠 Options: ${optionsList.join(', ') || 'Aucune'}%0A` +
                            `💰 Prix estimé: ${total.toFixed(2)} €`;
            
            const waButton = document.getElementById('waLink');
            waButton.href = `https://wa.me/33649553640?text=${message}`;
            waButton.style.display = 'block';
        }
    </script>
</body>
</html>
