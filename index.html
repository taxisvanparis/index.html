<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Van Paris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo"><span class="gold-text">TAXI VAN PARIS</span></div>
        </nav>

        <div class="hero-content">
            <h1 class="main-title">Votre Transport de Prestige à Paris</h1>
            <div class="booking-card">
                <h3>Réservation</h3>
                <form id="taxiForm">
                    <input type="text" placeholder="Départ" required>
                    <input type="text" placeholder="Arrivée" required>
                    <label>Passagers</label>
                    <select id="passagers">
                        <option value="4">1 à 4 pers.</option>
                        <option value="5">5 pers. (+5.50€)</option>
                        <option value="6">6 pers. (+11.00€)</option>
                        <option value="7">7 pers. (+16.50€)</option>
                        <option value="8">8 pers. (+22.00€)</option>
                    </select>
                    <label>Options</label>
                    <select id="optionSiege">
                        <option value="0">Aucun siège bébé</option>
                        <option value="2.90">Siège bébé / Réhausseur (+2.90€)</option>
                    </select>
                    <label>Distance (km)</label>
                    <input type="number" id="distance" placeholder="Ex: 10" required>
                    <button type="button" class="btn-calc" onclick="calculer()">Calculer le prix</button>
                    <div id="resultat" style="display:none; margin-top:15px; text-align:center;">
                        <span style="color:#c5a059; font-size:1.5rem; font-weight:bold;"><span id="prix">0</span> €</span>
                    </div>
                </form>
            </div>
        </div>
    </header>
    <script>
        function calculer() {
            const d = parseFloat(document.getElementById('distance').value);
            const p = parseInt(document.getElementById('passagers').value);
            const s = parseFloat(document.getElementById('optionSiege').value);
            if(!d) return alert("Entrez la distance");
            let total = 15 + (d * 2.90) + s;
            if(p > 4) total += (p - 4) * 5.50;
            document.getElementById('prix').innerText = total.toFixed(2);
            document.getElementById('resultat').style.display = "block";
        }
    </script>
</body>
</html>
