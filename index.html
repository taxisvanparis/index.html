<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxivan Paris</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .left h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .left span {
      color: #d4af37;
    }

    .left p {
      color: #d1d1d1;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .call-btn {
      display: inline-block;
      padding: 16px 30px;
      background: #d4af37;
      color: black;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.3s;
    }

    .call-btn:hover {
      transform: scale(1.05);
    }

    .booking-box {
      background: rgba(15,15,15,0.95);
      padding: 35px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .booking-box h2 {
      margin-bottom: 25px;
      font-size: 30px;
      color: #d4af37;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #1c1c1c;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1f1f1f;
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
    }

    .suggestions div {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .suggestions div:hover {
      background: #2f2f2f;
    }

    .options {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .option {
      flex: 1;
      min-width: 140px;
      background: #1c1c1c;
      border-radius: 14px;
      padding: 14px;
    }

    .option label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: #d4af37;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 25px;
      background: #181818;
      border-radius: 16px;
      padding: 20px;
      display: none;
    }

    .result h3 {
      color: #d4af37;
      margin-bottom: 12px;
    }

    .vehicle-image {
      width: 100%;
      max-width: 580px;
      border-radius: 24px;
      margin-top: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    .footer {
      text-align: center;
      padding: 30px;
      background: black;
      color: #aaa;
    }

    @media(max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .left h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="container">

    <div class="left">
      <h1>TaxiVan <span>Paris</span></h1>
      <p>
        Transport premium Van & Berline à Paris.
        Réservation rapide avec calcul automatique du tarif.
        Option siège bébé et réhausseur disponibles.
      </p>

      <a href="tel:+33649553640" class="call-btn">
        📞 Appeler maintenant
      </a>

      <!-- Image supprimée pour éviter l'écran noir -->
    </div>

    <div class="booking-box">
      <h2>Réserver votre trajet</h2>

      <div class="input-group">
        <input type="text" id="depart" placeholder="Adresse de départ">
        <div class="suggestions" id="departSuggestions"></div>
      </div>

      <div class="input-group">
        <input type="text" id="arrivee" placeholder="Adresse d'arrivée">
        <div class="suggestions" id="arriveeSuggestions"></div>
      </div>

      <div class="input-group">
        <input type="tel" id="telephone" placeholder="Votre numéro de téléphone">
      </div>

      <div class="input-group">
        <select id="passagers">
          <option value="1">1 Passager</option>
          <option value="2">2 Passagers</option>
          <option value="3">3 Passagers</option>
          <option value="4">4 Passagers</option>
          <option value="5">5 Passagers</option>
          <option value="6">6 Passagers</option>
          <option value="7">7 Passagers</option>
          <option value="8">8 Passagers</option>
        </select>
      </div>

      <div class="input-group">
        <select id="vehicule">
          <option value="Berline">Berline</option>
          <option value="Van">Van</option>
        </select>
      </div>

      <div class="options">
        <div class="option">
          <label>
            <input type="checkbox" id="bebe">
            Siège Bébé
          </label>
        </div>

        <div class="option">
          <label>
            <input type="checkbox" id="rehausseur">
            Réhausseur
          </label>
        </div>
      </div>

      <button class="btn" onclick="calculerTrajet()">
        Calculer le tarif
      </button>

      <div class="result" id="result">
        <h3>Votre estimation</h3>
        <p id="distanceText"></p>
        <p id="priceText"></p>
        <br>

        <a id="whatsappBtn" target="_blank">
          <button class="btn">
            Envoyer sur WhatsApp
          </button>
        </a>
      </div>
    </div>
  </div>
</section>

<div class="footer">
  © 2025 TaxiVan Paris - Transport Premium Paris
</div>

<script>

  const tarifPriseCharge = 15;
  const prixKm = 2.90;

  async function searchAddress(query, containerId) {
    if(query.length < 3) return;

    const response = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${query}`
    );

    const data = await response.json();

    const container = document.getElementById(containerId);
    container.innerHTML = '';

    data.slice(0,5).forEach(place => {
      const div = document.createElement('div');
      div.innerText = place.display_name;

      div.onclick = () => {
        if(containerId === 'departSuggestions') {
          document.getElementById('depart').value = place.display_name;
        } else {
          document.getElementById('arrivee').value = place.display_name;
        }

        container.innerHTML = '';
      };

      container.appendChild(div);
    });
  }

  document.getElementById('depart').addEventListener('input', (e) => {
    searchAddress(e.target.value, 'departSuggestions');
  });

  document.getElementById('arrivee').addEventListener('input', (e) => {
    searchAddress(e.target.value, 'arriveeSuggestions');
  });

  async function getCoordinates(address) {
    const response = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${address}`
    );

    const data = await response.json();

    if(data.length === 0) {
      alert('Adresse introuvable');
      return null;
    }

    return {
      lat: data[0].lat,
      lon: data[0].lon
    };
  }

  async function calculerTrajet() {

    const depart = document.getElementById('depart').value;
    const arrivee = document.getElementById('arrivee').value;
    const telephone = document.getElementById('telephone').value;
    const vehicule = document.getElementById('vehicule').value;
    const passagers = parseInt(document.getElementById('passagers').value);

    const bebe = document.getElementById('bebe').checked ? 'Oui' : 'Non';
    const rehausseur = document.getElementById('rehausseur').checked ? 'Oui' : 'Non';

    if(!depart || !arrivee || !telephone) {
      alert('Veuillez remplir tous les champs');
      return;
    }

    const departCoords = await getCoordinates(depart);
    const arriveeCoords = await getCoordinates(arrivee);

    if(!departCoords || !arriveeCoords) return;

    const routeResponse = await fetch(
      `https://router.project-osrm.org/route/v1/driving/${departCoords.lon},${departCoords.lat};${arriveeCoords.lon},${arriveeCoords.lat}?overview=false`
    );

    const routeData = await routeResponse.json();

    const distanceKm = routeData.routes[0].distance / 1000;

    let supplementPassagers = 0;

    if(passagers > 3) {
      supplementPassagers = (passagers - 3) * 5.5;
    }

    const total = tarifPriseCharge + (distanceKm * prixKm) + supplementPassagers;

    document.getElementById('result').style.display = 'block';

    document.getElementById('distanceText').innerHTML =
      `<strong>Distance :</strong> ${distanceKm.toFixed(1)} km`;

    document.getElementById('priceText').innerHTML =
      `<strong>Tarif :</strong> ${total.toFixed(2)} €<br><small>Supplément passagers : ${supplementPassagers.toFixed(2)} €</small>`;

    const message = `🚖 Nouvelle réservation TaxiVan Paris %0A%0A`
      + `📍 Départ : ${depart} %0A`
      + `📍 Arrivée : ${arrivee} %0A`
      + `🚘 Véhicule : ${vehicule} %0A`
      + `👥 Passagers : ${passagers} %0A`
      + `👶 Siège bébé : ${bebe} %0A`
      + `🪑 Réhausseur : ${rehausseur} %0A`
      + `📏 Distance : ${distanceKm.toFixed(1)} km %0A`
      + `💶 Tarif : ${total.toFixed(2)} € %0A`
      + `📞 Client : ${telephone}`;

    const whatsappURL = `https://wa.me/33649553640?text=${message}`;

    document.getElementById('whatsappBtn').href = whatsappURL;
  }

</script>

</body>
</html>
