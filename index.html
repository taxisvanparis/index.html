<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Van Paris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo"><span class="gold-text">TAXI VAN PARIS</span></div>
        </nav>

        <div class="hero-content">
            <h1 class="main-title">Votre Transport de Prestige à Paris</h1>
            
            <div class="booking-card">
                <h3>Réservation</h3>
                <form id="taxiForm">
                    <input type="text" id="depart" placeholder="Point de départ" required>
                    <input type="text" id="arrivee" placeholder="Destination" required>
                    
                    <div class="select-group">
                        <label>Nombre de passagers</label>
                        <select id="passagers">
                            <option value="1">1 à 4 Passagers (Standard)</option>
                            <option value="5">5 Passagers (+5.50€)</option>
                            <option value="6">6 Passagers (+11.00€)</option>
                            <option value="7">7 Passagers (+16.50€)</option>
                            <option value="8">8 Passagers (+22.00€)</option>
                        </select>
                    </div>

                    <div class="select-group">
                        <label>Options</label>
                        <div style="color:white; font-size:0.8rem; margin-bottom:10px;">
                            <input type="checkbox" id="siegeBebe" style="width:auto; margin-right:10px;"> Siège bébé / Réhausseur (+2.90€)
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Distance estimée (km)</label>
                        <input type="number" id="distance" placeholder="Ex: 10" required>
                    </div>

                    <button type="button" class="btn-calc" onclick="calculerPrix()">Calculer le prix</button>
                    
                    <div id="resultat" class="result-display" style="display:none; margin-top:20px; text-align:center; color:white;">
                        <p style="font-size:1.2rem;">Prix total estimé :</p>
                        <span id="prixTotal" style="color:#c5a059; font-size:2rem; font-weight:bold;">--</span> <span style="color:#c5a059; font-size:1.5rem;">€</span>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <script>
    function calculerPrix() {
        const dist = parseFloat(document.getElementById('distance').value);
        const passagers = parseInt(document.getElementById('passagers').value);
        const aBesoinSiege = document.getElementById('siegeBebe').checked;

        if (!dist || dist <= 0) {
            alert("Merci d'entrer la distance en km");
            return;
        }

        let total = 15 + (dist * 2.90); // Prise en charge + Prix au km

        if (aBesoinSiege) total += 2.90; // Option siège

        if (passagers > 4) {
            total += (passagers - 4) * 5.50; // Suppléments passagers
        }

        document.getElementById('resultat').style.display = "block";
        document.getElementById('prixTotal').innerText = total.toFixed(2);
    }
    </script>
</body>
</html>
